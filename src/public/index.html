<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123557"><title>Mapa de Salas</title><link rel="stylesheet" href="/style.css?v=2"></head><body><main id="app">
<section id="login" class="login"><div class="login-card"><div class="brand-mark" aria-hidden="true">17</div><p class="eyebrow">3º piso · área restrita</p><h1>Mapa de Salas</h1><p>Consulte e organize os consultórios com segurança.</p><form id="loginForm"><label>Usuário<input id="username" autocomplete="username" placeholder="Seu usuário" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" placeholder="Sua senha" required></label><button>Entrar</button><p id="loginError" class="error" aria-live="polite"></p></form></div></section>
<section id="workspace" hidden><header><div><p class="eyebrow">Mapa de Salas</p><h1>Agenda do 3º piso</h1><p id="userBadge" class="muted"></p></div><div class="headActions"><span id="saveState" aria-live="polite">Atualizado</span><button class="ghost" id="theme">Tema</button><button class="ghost" id="adminBtn" hidden>Administração</button><button class="ghost" id="logout">Sair</button></div></header><nav class="toolbar" aria-label="Filtros do mapa"><button id="prev" aria-label="Dia anterior">‹</button><button id="today">Hoje</button><input id="date" type="date"><button id="next" aria-label="Próximo dia">›</button><select id="mode"><option value="PADRAO">Semana-padrão</option><option value="DATA">Alteração por data</option></select><select id="day"></select><input id="search" placeholder="Buscar sala, profissional, especialidade ou código"><select id="statusFilter"><option value="">Todos os status</option><option>LIVRE</option><option>OCUPADA</option><option>RESERVADA</option><option>FECHADA</option></select><a class="button" href="/api/export.xlsx">Exportar Excel</a><button id="print">Imprimir</button></nav><section class="stats" id="stats"></section><section id="rooms" class="rooms"></section></section>
<dialog id="editor"><form method="dialog"><div class="dialogHead"><div><p class="eyebrow">DETALHES DA SALA</p><h2 id="editorTitle"></h2></div><button aria-label="Fechar">×</button></div><div id="turns"></div><footer><button value="cancel">Fechar</button></footer></form></dialog>
<dialog id="admin"><form method="dialog"><div class="dialogHead"><div><p class="eyebrow">CONTROLE DO SISTEMA</p><h2>Administração</h2></div><button>×</button></div><nav class="tabs"><button type="button" data-tab="users">Usuários</button><button type="button" data-tab="history">Histórico</button><button type="button" data-tab="import">Importação</button></nav><section id="adminContent"></section></form></dialog>
</main><script type="module" src="/app.js?v=2"></script></body></html>
